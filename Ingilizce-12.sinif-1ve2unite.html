<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12. Sınıf İngilizce 1. ve 2. Ünite Konuşma Sınavı</title>
    <!-- Okunaklı ve şık fontlar için Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --text-main: #2b3a4a;
            --text-sub: #5a6e7f;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --border: #d0e1f9;
            --correct-bg: #e8f5e9;
            --correct-border: #4caf50;
            --correct-text: #2e7d32;
            --wrong-bg: #ffebee;
            --wrong-border: #ef5350;
            --wrong-text: #c62828;
            --footer-bg: #e2e8f0;
            --footer-text: #64748b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-main: #edf2f7;
            --text-sub: #cbd5e0;
            --primary: #4a90e2;
            --primary-hover: #63b3ed;
            --border: #4a5568;
            --correct-bg: #1c3d27;
            --correct-border: #38a169;
            --correct-text: #9ae6b4;
            --wrong-bg: #4a1d24;
            --wrong-border: #e53e3e;
            --wrong-text: #feb2b2;
            --footer-bg: #111827;
            --footer-text: #9ca3af;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .header-controls {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 20px 30px 0 30px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
        }

        .main-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-grow: 1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        /* Ana Sayfa */
        .home-page h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-play {
            background-color: var(--primary);
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 14px 45px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 35px;
        }

        .btn-play:hover {
            background-color: var(--primary-hover);
        }

        .author-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .author-link {
            display: inline-block;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            border-bottom: 1px dashed var(--text-sub);
        }

        .author-link:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Oyun Sayfası */
        .game-page {
            display: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .word-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px 15px;
            margin-bottom: 25px;
        }

        .word-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: var(--bg-color);
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-pass, .btn-next {
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-pass {
            background: transparent;
            color: var(--text-sub);
        }

        .btn-pass:hover:not(:disabled) {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .btn-next {
            background-color: var(--correct-border);
            color: #ffffff;
            border: none;
            display: none;
        }

        .btn-next:hover {
            opacity: 0.9;
        }

        .btn-home {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        /* Footer Stilleri */
        footer {
            width: 100%;
            background-color: var(--footer-bg);
            color: var(--footer-text);
            padding: 15px 30px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid var(--border);
        }

        footer .footer-left {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        footer .footer-center a {
            color: var(--footer-text);
            text-decoration: none;
            font-weight: 600;
        }

        footer .footer-center a:hover {
            color: var(--primary);
        }

        footer .footer-right {
            text-align: right;
        }

        @media (min-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                text-align: center;
            }
            footer .footer-right {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="header-controls">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Karanlık Mod</button>
    </div>

    <div class="main-wrapper">
        <div class="container">
            <!-- ANA SAYFA -->
            <div class="home-page" id="homePage">
                <h1>12. Sınıf İngilizce 1. ve 2. Ünite Konuşma Sınavı</h1>
                <button class="btn-play" onclick="startGame()">Oyna</button>
                <div class="author-text">CREATED BY SERHAT ALPER</div>
                <a href="https://serhatalper.com" target="_blank" class="author-link">serhatalper.com</a>
            </div>

            <!-- OYUN SAYFASI -->
            <div class="game-page" id="gamePage">
                <div class="stats-bar">
                    <span>Skor: <strong id="score">0</strong></span>
                    <span>Kalan Kelime: <strong id="remaining">0</strong></span>
                </div>

                <div class="word-card">
                    <h2 id="questionWord">...</h2>
                </div>

                <div class="options-grid" id="optionsContainer">
                    <!-- Seçenekler JS ile dolacak -->
                </div>

                <div class="action-bar">
                    <button class="btn-home" onclick="goHome()">Ana Sayfaya Dön</button>
                    <button class="btn-pass" id="passBtn" onclick="passQuestion()">Pas Geç</button>
                    <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Sıradaki Soru</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-left">CREATED BY SERHAT ALPER</div>
        <div class="footer-center">
            <a href="https://serhatalper.com" target="_blank">serhatalper.com</a>
        </div>
        <div class="footer-right">Tüm hakları saklıdır, izinsiz çoğaltılamaz. Copyright © 2026</div>
    </footer>

    <script>
        // 12. Sınıf 1. ve 2. Ünite Kelime Veritabanı
        const vocabulary = [
            // 1. Ünite Kelimeleri
            { en: "Commute", tr: "Okula, işe gidip gelmek" },
            { en: "Conduct", tr: "Yürütmek, yapmak" },
            { en: "Diversity", tr: "Çeşitlilik" },
            { en: "Express", tr: "İfade etmek" },
            { en: "Friendship", tr: "Arkadaşlık" },
            { en: "Impact", tr: "Etki" },
            { en: "Instrument", tr: "Çalgı" },
            { en: "Meaningful", tr: "Anlamlı" },
            { en: "Patriotism", tr: "Vatanseverlik" },
            { en: "Personality", tr: "Kişilik" },
            { en: "Preference", tr: "Tercih" },
            { en: "Prejudice", tr: "Ön yargı" },
            { en: "Reveal", tr: "Ortaya çıkarmak" },
            { en: "Stressful", tr: "Stresli" },
            { en: "Value", tr: "Değer" },
            { en: "Lyrics", tr: "Şarkı sözü" },
            { en: "Genre", tr: "Tür" },
            { en: "Survey", tr: "Anket" },
            { en: "Intonation", tr: "Tonlama" },
            { en: "Elegant", tr: "Zarif" },
            { en: "Inspiring", tr: "İlham verici" },
            { en: "Introverted", tr: "İçedönük" },
            { en: "Extrovert", tr: "Dışadönük" },
            { en: "Relaxing", tr: "Rahatlatıcı" },
            { en: "Sorrow", tr: "Keder" },
            { en: "Unite", tr: "Birleştirmek" },

            // 2. Ünite Kelimeleri
            { en: "Adorable", tr: "Çok sevimli" },
            { en: "Generous", tr: "Cömert" },
            { en: "Supportive", tr: "Destekleyici" },
            { en: "Patient", tr: "Sabırlı" },
            { en: "Honest", tr: "Dürüst" },
            { en: "Trustworthy", tr: "Güvenilir" },
            { en: "Reliable", tr: "Sağlam, güvenilir" },
            { en: "Loyal", tr: "Sadık" },
            { en: "Honorable", tr: "Onurlu" },
            { en: "Responsible", tr: "Sorumluluk sahibi" },
            { en: "Hardworking", tr: "Çalışkan" },
            { en: "Competitive", tr: "Rekabetçi" },
            { en: "Understanding", tr: "Anlayışlı" },
            { en: "Respectful", tr: "Saygılı" },
            { en: "Introvert", tr: "İçedönük" },
            { en: "Outgoing", tr: "Sosyal" },
            { en: "Sociable", tr: "Sosyal, arkadaş canlısı" },
            { en: "Empathetic", tr: "Empati sahibi" },
            { en: "Determined", tr: "Kararlı" },
            { en: "Attentive", tr: "Dikkatli" },
            { en: "Reserved", tr: "Çekingen" },
            { en: "Insecure", tr: "Kendine güvenmeyen" },
            { en: "Spoilt", tr: "Şımarık" },
            { en: "Role model", tr: "Örnek model" },
            { en: "Handsome", tr: "Yakışıklı" },
            { en: "Athletic build", tr: "Atletik yapı" },
            { en: "Slight frame", tr: "İnce yapı" },
            { en: "Jawline", tr: "Çene hattı" },
            { en: "Facial features", tr: "Yüz hatları" },
            { en: "Curly hair", tr: "Kıvırcık saç" },
            { en: "Identical twins", tr: "Tek yumurta ikizleri" },
            { en: "Physique", tr: "Fiziksel yapı" },
            { en: "Integrity", tr: "Dürüstlük" },
            { en: "Dependability", tr: "Güvenilirlik" },
            { en: "Background", tr: "Geçmiş / Arka plan" },
            { en: "Confess", tr: "İtiraf etmek" },
            { en: "Confirm", tr: "Doğrulamak" },
            { en: "Ensure", tr: "Sağlamak / Garanti etmek" },
            { en: "Peer", tr: "Akran" },
            { en: "Effective", tr: "Etkili" },
            { en: "Trust", tr: "Güven" },
            { en: "Cosmopolitan", tr: "Kozmopolit" },
            { en: "Fluctuate", tr: "Dalgalanmak" },
            { en: "Trend", tr: "Eğilim" },
            { en: "Peak", tr: "Zirve" },
            { en: "Surge", tr: "Ani artış" },
            { en: "Drop", tr: "Ani düşüş" },
            { en: "Remain steady", tr: "Sabit kalmak" },
            { en: "Overall", tr: "Genel olarak" },
            { en: "Percentage", tr: "Yüzde" }
        ];

        let currentList = [];
        let currentWord = null;
        let score = 0;
        let canAnswer = true;

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                themeBtn.textContent = 'Karanlık Mod';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Aydınlık Mod';
            }
        }

        function startGame() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('gamePage').style.display = 'block';
            
            currentList = [...vocabulary].sort(() => Math.random() - 0.5);
            score = 0;
            document.getElementById('score').textContent = score;
            nextQuestion();
        }

        function goHome() {
            document.getElementById('gamePage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
        }

        function passQuestion() {
            if (!canAnswer) return;
            if (currentWord) {
                currentList.push(currentWord);
            }
            nextQuestion();
        }

        function nextQuestion() {
            if (currentList.length === 0) {
                alert(`Tebrikler! 12. Sınıf kelimelerinin tamamını başardın.\nToplam Skorun: ${score}`);
                goHome();
                return;
            }

            canAnswer = true;
            document.getElementById('passBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('remaining').textContent = currentList.length;

            currentWord = currentList.shift();
            document.getElementById('questionWord').textContent = currentWord.en;

            let wrongOptions = vocabulary
                .filter(item => item.tr !== currentWord.tr)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(item => item.tr);

            let allOptions = [currentWord.tr, ...wrongOptions].sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, clickedBtn) {
            if (!canAnswer) return;
            canAnswer = false;

            const allButtons = document.querySelectorAll('.option-btn');
            
            if (selectedOption === currentWord.tr) {
                clickedBtn.classList.add('correct');
                score += 10;
                document.getElementById('score').textContent = score;
            } else {
                clickedBtn.classList.add('wrong');
                allButtons.forEach(btn => {
                    if (btn.textContent === currentWord.tr) {
                        btn.classList.add('correct');
                    }
                });
                currentList.push(currentWord);
            }

            document.getElementById('passBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
